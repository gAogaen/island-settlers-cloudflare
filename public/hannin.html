<!doctype html><html lang="ja" data-game="hannin"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b30"><title>犯人は踊る | ボードゲームオンライン</title><link rel="stylesheet" href="/theme.css"><script src="/theme.js"></script><link rel="stylesheet" href="/hannin.css"></head><body><header><a href="/">← ゲーム一覧</a><h1>🕵️ 犯人は踊る</h1><button id="rules">遊び方</button></header><main><section id="entry" class="panel"><h2>推理のテーブルへ</h2><p>3〜8人で遊ぶ、犯人カードの行方を追う推理カードゲーム。</p><label>名前<input id="name" maxlength="16" placeholder="プレイヤー名"></label><button id="create" class="primary">新しい部屋を作る</button><label>部屋コード<input id="code" maxlength="6" placeholder="ABC123" autocapitalize="characters"></label><div class="actions"><button id="join">参加・復帰</button><button id="watch">観戦</button></div><p id="entryError" role="alert"></p></section><section id="room" hidden><div class="room-head"><div><h2>ROOM <span id="roomCode"></span></h2><p id="status"></p></div><div class="actions"><button id="copy">招待リンクをコピー</button><button id="leave">退出</button></div></div><div id="winner" class="winner" hidden></div><div id="players" class="seats"></div><div class="panel"><h3>あなたの手札 <small>本人だけに表示</small></h3><div id="hand" class="hand"></div><div id="selection"></div><div id="controls" class="actions"></div></div><div class="panel"><h3>ゲームログ</h3><div id="log" class="log"></div></div></section></main><dialog id="rulesDialog"><h2>遊び方</h2><p>各自4枚の手札を持ち、順番にカードを使います。犯人カードはプレイヤー間を移動します。探偵は犯人を見つけ、犯人は逃げ切りを目指します。</p><p>この実装は現在試験版です。カード効果や配分は正式版と照合中のため、実際の製品のルールと異なる可能性があります。</p><button id="rulesClose">閉じる</button></dialog><div id="toast" role="status"></div><script src="/hannin.js" defer></script></body></html>
