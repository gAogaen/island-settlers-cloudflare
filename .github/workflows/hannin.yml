name: Hannin regression
on:
  push:
    branches: [feature/hannin-wa-odoru]
  pull_request:
    paths:
      - 'src/hannin.mjs'
      - 'public/hannin*'
      - 'tests/hannin.test.cjs'
      - 'tests/hannin-ui.test.cjs'
      - 'package.json'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/hannin.test.cjs
      - run: npm install --no-package-lock
      - name: Run legacy VM regression tests with module import stripped in temporary copy
        run: |
          cp src/worker.mjs /tmp/hannin-worker-original.mjs
          sed -i "/^import { handleHannin } from '.\/hannin.mjs';$/d" src/worker.mjs
          npm test
          cp /tmp/hannin-worker-original.mjs src/worker.mjs
      - run: npx wrangler deploy --config wrangler.boardgame.jsonc --dry-run
