name: Hannin regression
on:
  push:
    branches: [feature/hannin-wa-odoru]
  pull_request:
    paths:
      - 'src/hannin.mjs'
      - 'public/hannin*'
      - 'tests/hannin.test.cjs'
      - 'package.json'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/hannin.test.cjs
      - run: npm install --no-package-lock
      - run: npm test
      - run: npx wrangler deploy --config wrangler.boardgame.jsonc --dry-run
